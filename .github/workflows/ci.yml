name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS ${{ matrix.pretty }})
    runs-on: ${{ matrix.macOS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macOS: macos-15
            pretty: "15"
          - macOS: macos-26
            pretty: "26"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          swift --version
          xcodebuild -version

      - name: Build (debug)
        run: swift build --disable-sandbox

      - name: Test
        run: swift test --disable-sandbox

      - name: Build (release, packaging sanity check)
        run: swift build -c release --disable-sandbox --product Openly

      - name: Assemble .app
        run: ./make-app.sh
